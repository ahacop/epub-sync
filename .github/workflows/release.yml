name: Release

# Build the CLI and the viewer for Apple Silicon on a version tag and attach
# one tarball with both binaries to a GitHub Release. The Homebrew formula
# downloads this tarball, so a user who runs brew install needs no Rust or Go
# toolchain.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: kepub-shim/go.mod
      - name: Build
        run: cargo build --release --locked -p epubsync-cli -p epubsync-app
      - name: Check that the binaries link only system libraries
        run: |
          for bin in epubsync epubsync-app; do
            otool -L "target/release/$bin"
            if otool -L "target/release/$bin" | grep -vE '^target/|/usr/lib/|/System/Library/'; then
              echo "$bin links a library outside the system"
              exit 1
            fi
          done
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="epubsync-$version-$TARGET"
          mkdir "$name"
          cp target/release/epubsync target/release/epubsync-app "$name/"
          COPYFILE_DISABLE=1 tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "EpubSync ${GITHUB_REF_NAME#v}" --generate-notes \
            epubsync-*.tar.gz SHA256SUMS
