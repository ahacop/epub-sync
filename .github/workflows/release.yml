name: Release

# Build the CLI for Apple Silicon on a version tag and attach the tarball to
# a GitHub Release. The Homebrew formula downloads this tarball, so a user
# who runs brew install needs no Rust or Go toolchain.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: kepub-shim/go.mod
      - name: Build
        run: cargo build --release --locked -p epubsync-cli
      - name: Check that the binary links only system libraries
        run: |
          otool -L target/release/epubsync
          ! otool -L target/release/epubsync | grep -vE '^target/|/usr/lib/|/System/Library/'
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="epubsync-$version-$TARGET"
          mkdir "$name"
          cp target/release/epubsync "$name/"
          COPYFILE_DISABLE=1 tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "EpubSync ${GITHUB_REF_NAME#v}" --generate-notes \
            epubsync-*.tar.gz SHA256SUMS
