name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      # Pushes the Linux store paths the job builds to the ahacop cache,
      # so a NixOS machine that installs epubsync downloads it instead of
      # compiling it. Without the secret, as on a fork's pull request,
      # the step only reads from the cache.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: runner.os == 'Linux'
        with:
          name: ahacop
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Test
        run: nix develop -c cargo test --locked
      - name: Build the package
        run: nix build --print-build-logs
      - name: Build the viewer package
        run: nix build .#app --print-build-logs
      - name: Build the CLI
        run: nix develop -c cargo build --locked -p epubsync-cli
      - name: Check that the binary links no Go or kepubify shared library
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L target/debug/epubsync
            ! otool -L target/debug/epubsync | grep -iE 'kepub|libgo'
          else
            ldd target/debug/epubsync
            ! ldd target/debug/epubsync | grep -iE 'kepub|libgo'
          fi
